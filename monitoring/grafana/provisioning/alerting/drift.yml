apiVersion: 1

contactPoints:
  - orgId: 1
    name: Spark Check retraining
    receivers:
      - uid: spark-check-retrain-webhook
        type: webhook
        disableResolveMessage: true
        settings:
          url: $MONITORING_RETRAIN_WEBHOOK_URL
          httpMethod: POST
          username: grafana
          password: $MONITORING_ALERT_PASSWORD

groups:
  - orgId: 1
    name: Spark Check drift
    folder: Spark Check
    interval: 1m
    rules:
      - uid: spark-check-input-drift
        title: Significant input drift
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          monitoring_action: retrain
        annotations:
          summary: Evidently flagged significant input drift in a recent prediction window.
        notification_settings:
          receiver: Spark Check retraining
          group_wait: 0s
        data:
          - refId: A
            datasourceUid: spark-check-postgres
            relativeTimeRange: {from: 900, to: 0}
            model:
              refId: A
              datasource: {type: grafana-postgresql-datasource, uid: spark-check-postgres}
              editorMode: code
              format: time_series
              rawQuery: true
              rawSql: |
                WITH latest AS (
                  SELECT DISTINCT ON (model_version)
                    window_end, window_start, model_version, drift_detected
                  FROM monitoring_results
                  WHERE window_end <= now()
                  ORDER BY model_version, window_end DESC, computed_at DESC, reference_id
                )
                SELECT window_end AS time,
                       CASE WHEN drift_detected THEN 1 ELSE 0 END::double precision AS drift,
                       model_version
                FROM latest
                WHERE window_end >= now() - GREATEST(
                  interval '15 minutes', 3 * (window_end - window_start)
                )
                ORDER BY window_end
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: C
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last, params: []}
                  type: query
