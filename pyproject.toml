[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-check"
version = "0.1.0"
description = "Start-of-term survey screening for end-of-term depressive symptoms (INSY 684)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "mlflow>=3.0",
    "prefect>=3.0",
]

[project.optional-dependencies]
kaggle = ["kagglehub[pandas-datasets]"]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]   # tests can import spark_check without installing it
